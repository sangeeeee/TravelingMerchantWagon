    group = 'verification'
    description = 'Run Fabric 1.21.1 wagon gameplay tests.'
}
tasks.named('runClientSmokeTest') {
    group = 'verification'
    description = 'Check Fabric wagon rendering or inventory in an isolated client directory.'
