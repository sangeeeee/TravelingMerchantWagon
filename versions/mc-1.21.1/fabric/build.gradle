    carryOn: "maven.modrinth:joEfVgkn:${carry_on_fabric_version_id}",
    maid: "maven.modrinth:Tv58SCnQ:${maid_fabric_version_id}",
    travelersBackpack: "maven.modrinth:rlloIFEV:${travelers_backpack_fabric_version_id}",
    sophisticatedBackpacks: "maven.modrinth:ouNrBQtq:${sophisticated_backpacks_fabric_version_id}",
