def fabricCompatTestEntries = []
if (selectedRuntimeMods.contains('maid')) fabricCompatTestEntries.add('com.sange.tm_wagon.compat.maid.WagonMaidGameTests')
if (selectedRuntimeMods.contains('travelersBackpack') && selectedRuntimeMods.contains('sophisticatedBackpacks')) fabricCompatTestEntries.add('com.sange.tm_wagon.cargo.BackpackGameTests')
