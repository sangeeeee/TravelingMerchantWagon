    sable: "maven.modrinth:T9PomCSv:${sable_fabric_version_id}",
    patchouli: "maven.modrinth:nU0bVIaL:${patchouli_fabric_version_id}",
    tacz: "maven.modrinth:1j76DVHU:${tacz_fabric_version_id}",
    swingThrough: "maven.modrinth:JyKlunuD:${swing_through_fabric_version_id}",
    lithium: "maven.modrinth:gvQqBUqZ:${lithium_fabric_version_id}",
