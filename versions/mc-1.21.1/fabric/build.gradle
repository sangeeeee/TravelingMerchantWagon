    cardinalComponents: "maven.modrinth:K01OU20C:${cardinal_components_fabric_version_id}"
]

dependencies {
    registerTransform(ExtractEmbeddedFabricApis) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-fabric-embedded-apis')
    }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation("maven.modrinth:8BmcQJ2H:${geckolib_fabric_version_id}") { transitive = false }
    modImplementation("maven.modrinth:ohNO6lps:${forge_config_api_port_fabric_version_id}") { transitive = false }
    implementation 'com.electronwill.night-config:core:3.8.0'
    implementation 'com.electronwill.night-config:toml:3.8.0'

    compileOnly project(':core')
    // Bind the core's compiled classes to tm_wagon in development, just as in
