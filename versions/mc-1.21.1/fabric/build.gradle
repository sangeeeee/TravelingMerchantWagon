// Loom remaps dependencies during configuration, before normal extraction tasks
// can run. An artifact transform makes nested APIs available on a clean checkout
// and caches their extraction without adding them to the development runtime.
abstract class ExtractEmbeddedFabricApis implements TransformAction<TransformParameters.None> {
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        new ZipFile(inputArtifact.get().asFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar')
                        && ExtractEmbeddedFabricApis.isCompileApi(archive, entry)) {
                    def destination = outputs.file(new File(entry.name).name)
                    archive.getInputStream(entry).withCloseable { input ->
                        destination.withOutputStream { output -> input.transferTo(output) }
                    }
                }
            }
        }
    }

    static boolean isCompileApi(ZipFile archive, java.util.zip.ZipEntry entry) {
        new ZipInputStream(archive.getInputStream(entry)).withCloseable { nested ->
            java.util.zip.ZipEntry nestedEntry
            while ((nestedEntry = nested.nextEntry) != null) {
                if (nestedEntry.name == 'fabric.mod.json') {
                    def id = new JsonSlurper().parseText(new String(nested.readAllBytes(), 'UTF-8')).id
                    return (id in ['sablecompanion', 'team_reborn_energy',
                                  'cardinal-components-base', 'cardinal-components-entity']
                            || id.startsWith('porting_lib_'))
                }
            }
            return false
        }
    }
}

