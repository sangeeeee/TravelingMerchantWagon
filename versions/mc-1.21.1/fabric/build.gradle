def fabricCompatTestJson = fabricCompatTestEntries.collect { ', "' + it + '"' }.join('')
tasks.named('processGametestResources') {
    inputs.property('compatTestEntrypoints', fabricCompatTestJson)
    filesMatching('fabric.mod.json') { expand(compatTestEntrypoints: fabricCompatTestJson) }
}
