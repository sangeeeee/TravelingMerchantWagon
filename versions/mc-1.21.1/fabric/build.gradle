    runtimeOnly files(coreOutput)
    commonJava project(path: ':mc-1.21.1:common', configuration: 'commonJava')
    commonGameplayJava project(path: ':mc-1.21.1:common', configuration: 'commonGameplayJava')
    commonResources project(path: ':mc-1.21.1:common', configuration: 'commonResources')

    compatibilityMods.values().each { coordinate ->
        modCompileOnly(coordinate) { transitive = false }
    }
    // These upstream mods ship their support libraries as nested JARs. Expose
    // their APIs to the compiler without duplicating them in the runtime or mod.
    ['sable', 'sophisticatedCore', 'cardinalComponents'].each { name ->
        embeddedCompatibilityArchives(compatibilityMods[name]) { transitive = false }
    }
}

def embeddedCompatibilityApis = configurations.embeddedCompatibilityArchives.incoming.artifactView {
    attributes {
        attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-fabric-embedded-apis')
    }
}.files
dependencies { modCompileOnly embeddedCompatibilityApis }

// Only explicit development profiles install optional mods. Published mod JARs
// will not bundle any of these mods; each loader owns its own runtime classpath.
def runtimeProfiles = [
    Maid: ['maid', 'forgeConfigApiPort'],
    Backpacks: ['travelersBackpack', 'sophisticatedBackpacks', 'sophisticatedCore',
                'forgeConfigApiPort', 'clothConfig', 'cardinalComponents'],
    CarryOn: ['carryOn'],
    Sable: ['sable'],
    Patchouli: ['patchouli'],
    Guns: ['tacz', 'forgeConfigApiPort'],
    SwingThrough: ['swingThrough'],
    Lithium: ['lithium'],
    Iris: ['iris', 'sodium'],
    Jei: ['jei']
]
def withAllCompat = providers.gradleProperty('fabricWithAllCompat').getOrElse('false').toBoolean()
def selectedRuntimeMods = new LinkedHashSet<String>()
runtimeProfiles.each { name, mods ->
    if (withAllCompat || providers.gradleProperty("fabricWith${name}").getOrElse('false').toBoolean()) {
        selectedRuntimeMods.addAll(mods)
    }
}
// Sable 2.0.6 requires experimental Sodium, incompatible with Iris 1.8.8.
if (selectedRuntimeMods.contains('sable')) selectedRuntimeMods.removeAll(['iris', 'sodium'])
dependencies {
    selectedRuntimeMods.each { name ->
        modLocalRuntime(compatibilityMods[name]) { transitive = false }
    }
}

// Loom strips nested archives from remapped development mods. Restore their
// actual shipped runtime libraries separately; release artifacts do not bundle them.
abstract class ExtractEmbeddedFabricRuntime implements TransformAction<TransformParameters.None> {
    @InputArtifact abstract Provider<FileSystemLocation> getInputArtifact()
    @Override void transform(TransformOutputs outputs) {
        new ZipFile(inputArtifact.get().asFile).withCloseable { archive ->
            archive.entries().findAll { it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { entry ->
                expand(archive.getInputStream(entry).readAllBytes(), new File(entry.name).name, outputs)
            }
        }
    }
    static void expand(byte[] bytes, String name, TransformOutputs outputs) {
        def nested = new LinkedHashMap<String, byte[]>()
        def id = null
        new ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { stream ->
            java.util.zip.ZipEntry entry
            while ((entry = stream.nextEntry) != null) {
                if (entry.name == 'fabric.mod.json') id = new JsonSlurper().parseText(new String(stream.readAllBytes(), 'UTF-8')).id
                else if (entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar')) nested[entry.name] = stream.readAllBytes()
            }
        }
        if (!(id in ['fabric-api', 'fabricloader', 'mixinextras', 'forgeconfigapiport'])) {
            outputs.file(name).bytes = bytes
            nested.each { path, content -> expand(content, new File(path).name, outputs) }
        }
    }
}
dependencies {
    registerTransform(ExtractEmbeddedFabricRuntime) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-fabric-runtime-libraries')
    }
    selectedRuntimeMods.each { name ->
        embeddedRuntimeArchives(compatibilityMods[name]) { transitive = false }
    }
    modLocalRuntime configurations.embeddedRuntimeArchives.incoming.artifactView {
        attributes { attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-fabric-runtime-libraries') }
    }.files
}

