def fabricSmokeEnabled = providers.gradleProperty('fabricSmoke').getOrElse('false').toBoolean()
loom {
    mods {
        tm_wagon {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
            sourceSet sourceSets.clientSmoke
        }
    }
    runs {
        client {
            runDir 'run'
            if (fabricSmokeEnabled) source sourceSets.clientSmoke
            vmArg '-Dtm_wagon.fabricSmoke=' + providers.gradleProperty('fabricSmoke').getOrElse('false')
            vmArg '-Dtm_wagon.fabricSmokeMode=' + providers.gradleProperty('fabricSmokeMode').getOrElse('models')
            vmArg '-Dtm_wagon.fabricSmokeWorld=' + providers.gradleProperty('fabricSmokeWorld').getOrElse('repro')
        }
        server { runDir 'run-server' }
        clientSmokeTest {
            client()
            source sourceSets.clientSmoke
            runDir 'build/client-smoke'
            vmArg '-Dtm_wagon.fabricSmoke=true'
            vmArg '-Dtm_wagon.fabricSmokeMode=' + providers.gradleProperty('fabricSmokeMode').getOrElse('models')
            vmArg '-Dtm_wagon.fabricSmokeWorld=' + providers.gradleProperty('fabricSmokeWorld').getOrElse('repro')
            ideConfigGenerated false
        }
    }
}
def fabricResourceVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('version', project.version)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') { expand(version: fabricResourceVersion) }
}
def fabricLicenseName = "LICENSE_${mod_id}"
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from(rootProject.file('LICENSE')) { rename { fabricLicenseName } }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '500'] }
tasks.register('verifyCompatibilityDependencies') {
    group = 'verification'
    description = 'Resolve Fabric compatibility APIs, nested APIs and selected runtime profiles.'
    dependsOn tasks.named('compileJava')
    inputs.files(configurations.compileClasspath, configurations.runtimeClasspath)
    inputs.property('expectedApiIds', ['geckolib', 'carryon', 'touhou_little_maid',
        'travelersbackpack', 'sophisticatedbackpacks', 'sophisticatedcore', 'sable',
        'patchouli', 'tacz', 'swingthrough', 'lithium', 'iris', 'sodium', 'jei',
        'forgeconfigapiport', 'cloth-config', 'sablecompanion', 'team_reborn_energy',
        'porting_lib_core', 'cardinal-components-base', 'cardinal-components-entity'])
    doLast {
        def foundIds = new HashSet<String>()
        inputs.files.files.findAll { it.name.endsWith('.jar') }.each { archiveFile ->
            new ZipFile(archiveFile).withCloseable { archive ->
                def metadata = archive.getEntry('fabric.mod.json')
                if (metadata != null) {
                    archive.getInputStream(metadata).withCloseable { input ->
                        foundIds.add(new JsonSlurper().parse(input, 'UTF-8').id.toString())
                    }
                }
            }
        }
        def missing = inputs.properties.expectedApiIds.findAll { !foundIds.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Fabric compatibility APIs missing from classpath: ${missing}")
        }
        logger.lifecycle("Fabric compatibility classpaths resolved (${inputs.files.files.size()} files).")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyCompatibilityDependencies') }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'tm_wagon_tests'
    enableGameTests = true
    enableClientGameTests = false
