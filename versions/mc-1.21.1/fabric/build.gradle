tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    group = 'minecraft'
    description = "Launch Minecraft ${minecraft_version} on Fabric with tm_wagon (${name == 'runClient' ? 'client' : 'server'})."
}
