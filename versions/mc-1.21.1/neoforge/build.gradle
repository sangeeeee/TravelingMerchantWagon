import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// Sodium 0.8's launcher declares the same mod ID as its nested implementation.
// FML 4 selects the launcher in place of the implementation on a dev classpath.
// Retain its library/services and JarJar metadata, removing only the duplicate
// root mod declaration so normal JarJar discovery loads the real Sodium mod.
abstract class PrepareSodiumDevelopmentJar implements TransformAction<TransformParameters.None> {
    @InputArtifact abstract Provider<FileSystemLocation> getInputArtifact()
    @Override void transform(TransformOutputs outputs) {
        def source = inputArtifact.get().asFile
        def destination = outputs.file(source.name.replace('.jar', '-development.jar'))
        new ZipFile(source).withCloseable { archive ->
            boolean wrapper = archive.entries().any { it.name.startsWith('META-INF/jarjar/net.caffeinemc.sodium-') }
            new ZipOutputStream(new FileOutputStream(destination)).withCloseable { output ->
                archive.entries().each { entry ->
                    if (!(wrapper && entry.name == 'META-INF/neoforge.mods.toml')) {
                        output.putNextEntry(new ZipEntry(entry.name))
                        archive.getInputStream(entry).withCloseable { it.transferTo(output) }
                        output.closeEntry()
                    }
                }
            }
        }
    }
}

apply from: rootProject.file('gradle/load-target-properties.gradle')

evaluationDependsOn(':core')

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

configurations {
    commonJava { canBeConsumed = false; canBeResolved = true }
    commonGameplayJava { canBeConsumed = false; canBeResolved = true }
    commonResources { canBeConsumed = false; canBeResolved = true }
}
dependencies {
    compileOnly project(':core')
    commonJava project(path: ':mc-1.21.1:common', configuration: 'commonJava')
    commonGameplayJava project(path: ':mc-1.21.1:common', configuration: 'commonGameplayJava')
    commonResources project(path: ':mc-1.21.1:common', configuration: 'commonResources')
}
sourceSets.main.java.srcDir(configurations.commonJava)
sourceSets.main.java.srcDir(configurations.commonGameplayJava)
sourceSets.main.resources.srcDir(configurations.commonResources)

// Real-world placement tests are available in development runs, excluded from
// the distributable mod JAR.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup('mezz.jei')
            includeGroup('vazkii.patchouli')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter {
            includeModule('curse.maven', 'touhou-little-maid-355044')
            includeModule('curse.maven', 'swing-through-grass-1477279')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeModule('maven.modrinth', 'sable')
            includeModule('maven.modrinth', 'carry-on')
            includeModule('maven.modrinth', 'travelersbackpack')
            includeModule('maven.modrinth', 'sophisticated-backpacks')
            includeModule('maven.modrinth', 'sophisticated-core')
            includeModule('maven.modrinth', 'tacz-1.21.1')
            includeModule('maven.modrinth', 'lithium')
            includeModule('maven.modrinth', 'iris')
            includeModule('maven.modrinth', 'sodium')
            includeModule('maven.modrinth', 'architectury-api')
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        backpackClientSmokeTest {
            client()
            gameDirectory = project.file('build/backpack-client')
            systemProperty 'tm_wagon.backpackClientSmoke', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        backpackGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/backpack-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tm_wagon_backpacks'
        }
        uphillPerformanceServer {
            type = "gameTestServer"
            gameDirectory = project.file(providers.gradleProperty('performanceDirectory').getOrElse('build/uphill-performance'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tm_wagon_uphill'
            systemProperty 'tm_wagon.uphill', 'true'
            systemProperty 'tm_wagon.uphillCases', providers.gradleProperty('performanceCases').getOrElse('')
            systemProperty 'tm_wagon.uphillDiagnostics', providers.gradleProperty('uphillDiagnostics').getOrElse('false')
        }
        performanceServer {
            type = "gameTestServer"
            // Separate fresh worlds for before/after measurements without changing normal game runs.
            gameDirectory = project.file(providers.gradleProperty('performanceDirectory').getOrElse('build/performance-server'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tm_wagon_perf'
            systemProperty 'tm_wagon.performance', 'true'
            systemProperty 'tm_wagon.performanceCases', providers.gradleProperty('performanceCases').getOrElse('')
        }
        performanceClient {
            client()
            gameDirectory = project.file('build/performance-client')
            systemProperty 'tm_wagon.performanceClient', 'true'
            systemProperty 'tm_wagon.performanceClientCases', providers.gradleProperty('performanceClientCases').getOrElse('')
            programArguments.addAll '--width', '1200', '--height', '800'
        }
        client {
            client()
            if (providers.gradleProperty('clientSmoke').getOrElse('false').toBoolean()) {
                gameDirectory = project.file('build/client-smoke')
                systemProperty 'tm_wagon.clientSmokeTest', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientSmokeTest {
            client()
            systemProperty 'tm_wagon.clientSmokeTest', 'true'
            programArguments.addAll '--width', '1200', '--height', '800'
        }

        dismountSmokeTest {
            client()
            gameDirectory = project.file('build/dismount-client')
            systemProperty 'tm_wagon.dismountSmokeTest', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        strawMatSleepSmokeTest {
            client()
            gameDirectory = project.file('build/straw-mat-client')
            systemProperty 'tm_wagon.strawMatSleepSmokeTest', 'true'
            systemProperty 'tm_wagon.sleepingBagSleepSmokeTest', providers.gradleProperty('sleepingBagSmoke').getOrElse('false')
            programArguments.addAll '--width', '1000', '--height', '700'
        }

        containerVariantSmokeTest {
            client()
            gameDirectory = project.file('build/container-client')
            systemProperty 'tm_wagon.stoolSmokeTest', 'true'
            systemProperty 'tm_wagon.containerVariantSmoke', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        stoolSmokeTest {
            client()
            gameDirectory = project.file('build/stool-client')
            systemProperty 'tm_wagon.stoolSmokeTest', 'true'
            systemProperty 'tm_wagon.stoolSmokeExtended', providers.gradleProperty('extendedStoolSmoke').getOrElse('false')
            programArguments.addAll '--width', '1000', '--height', '700'
        }

        wagonShadowSmokeTest {
            client()
            gameDirectory = project.file('build/iris-cargo-client')
            systemProperty 'tm_wagon.shadowSmokeTest', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        drivingSmokeTest {
            client()
            gameDirectory = project.file('build/driving-client')
            systemProperty 'tm_wagon.drivingSmokeTest', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }

        hammerSmokeTest {
            client()
            gameDirectory = project.file('build/hammer-client')
            systemProperty 'tm_wagon.hammerSmokeTest', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        jeiSmokeTest {
            client()
            gameDirectory = project.file('build/jei-client')
            systemProperty 'tm_wagon.jeiSmokeTest', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        handbookSmokeTest {
            client()
            gameDirectory = project.file('build/handbook-client')
            systemProperty 'tm_wagon.handbookSmokeTest', 'true'
            systemProperty 'tm_wagon.handbookPreviewOnly', providers.gradleProperty('handbookPreviewOnly').getOrElse('false')
            programArguments.addAll '--width', '1000', '--height', '700'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        carryOnClientSmokeTest {
            client()
            gameDirectory = project.file('build/carryon-client')
            systemProperty 'tm_wagon.carryOnClientSmoke', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        carryOnGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/carryon-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tm_wagon_carryon'
            systemProperty 'tm_wagon.requireCarryOnTest', 'true'
        }
        maidGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/maid-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tm_wagon_maid,tm_wagon_maid_combat'
        }
        maidClientSmokeTest {
            client()
            gameDirectory = project.file('build/maid-client')
            systemProperty 'tm_wagon.maidClientSmoke', 'true'
            programArguments.addAll '--width', '1000', '--height', '700'
        }
        bclibGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/bclib-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tm_wagon.requireBclibTest', 'true'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (providers.gradleProperty('performanceRecording').isPresent()) {
                jvmArgument "-XX:StartFlightRecording=filename=${file(providers.gradleProperty('performanceRecording').get()).absolutePath},settings=profile,dumponexit=true,maxsize=256m"
            }
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    sableApi
    compileOnly.extendsFrom sableApi
    sodiumDevelopmentArchive { canBeConsumed = false; canBeResolved = true }
}

// The published Sable mod embeds its companion API rather than declaring it in its POM.
def sableApiFiles = configurations.sableApi
def extractSableCompanionApi = tasks.register('extractSableCompanionApi', Sync) {
    from({ zipTree(sableApiFiles.singleFile) }) {
        include 'META-INF/jarjar/sable-companion-common-*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sable-compile-api')
}

dependencies {
    // Optional recipe viewer API; never bundle JEI or require it on a server.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.39.0.372'
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Compile against the minimum supported NeoForge version; do not bundle Carry On.
    compileOnly('maven.modrinth:carry-on:cgZi7nC7') { transitive = false }

    // Touhou Little Maid 1.5.3 for NeoForge 1.21.1; compile-time access only.
    compileOnly('curse.maven:touhou-little-maid-355044:8061852') { transitive = false }

    // Optional backpack APIs and Sophisticated Backpacks' required core library.
    // Pin NeoForge release IDs; keep all three out of runtime and the published JAR.
    compileOnly("maven.modrinth:travelersbackpack:${travelers_backpack_neoforge_version_id}") { transitive = false }
    compileOnly("maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_neoforge_version_id}") { transitive = false }
    compileOnly("maven.modrinth:sophisticated-core:${sophisticated_core_neoforge_version_id}") { transitive = false }

    // Official Patchouli API; the optional mod is never bundled.
    compileOnly("vazkii.patchouli:Patchouli:${patchouli_version}:api") { transitive = false }

    // Optional compatibility API. Pin the NeoForge release ID to avoid selecting
    // the Fabric artifact with the same version number. Never bundle it.
    sableApi("maven.modrinth:sable:${sable_neoforge_version_id}") {
        transitive = false
    }
    compileOnly files(extractSableCompanionApi.map { it.destinationDir.toPath().resolve('sable-companion-common-1.21.1-1.6.0.jar').toFile() })
}

// Load integrations in development by default without publishing runtime
// dependencies or bundling third-party mods into the wagon JAR.
def runtimeProfiles = [
    Maid: ["curse.maven:touhou-little-maid-355044:${maid_neoforge_file_id}"],
    CarryOn: ["maven.modrinth:carry-on:${carry_on_neoforge_version_id}"],
    Backpacks: ["maven.modrinth:travelersbackpack:${travelers_backpack_neoforge_version_id}",
                "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_neoforge_version_id}",
                "maven.modrinth:sophisticated-core:${sophisticated_core_neoforge_version_id}"],
    Sable: ["maven.modrinth:sable:${sable_neoforge_version_id}"],
    Patchouli: ["vazkii.patchouli:Patchouli:${patchouli_version}"],
    Guns: ["maven.modrinth:tacz-1.21.1:${tacz_neoforge_version_id}"],
    Lithium: ["maven.modrinth:lithium:${lithium_neoforge_version_id}"],
    SwingThrough: ["curse.maven:swing-through-grass-1477279:${swing_through_grass_neoforge_file_id}",
                   "maven.modrinth:architectury-api:${architectury_neoforge_version_id}"],
    Iris: ["maven.modrinth:iris:${iris_neoforge_version_id}",
           "maven.modrinth:sodium:${sodium_neoforge_version_id}"],
    Jei: ["mezz.jei:jei-${minecraft_version}-neoforge:${jei_neoforge_version}"]
]
def runtimeJarOverrides = [Patchouli: 'patchouliTestJar', Lithium: 'lithiumTestJar',
                           SwingThrough: 'swingThroughGrassTestJar', Jei: 'jeiTestJar']
def withAllCompat = providers.gradleProperty('withAllCompat').getOrElse('true').toBoolean()
dependencies {
    registerTransform(PrepareSodiumDevelopmentJar) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-sodium-development')
    }
    runtimeProfiles.each { name, coordinates ->
        def override = runtimeJarOverrides[name] == null ? null : providers.gradleProperty(runtimeJarOverrides[name])
        if (override != null && override.isPresent()) {
            localRuntime files(override.get())
            // Local SwingThroughGrass builds still need Architectury.
            if (name == 'SwingThrough') localRuntime(coordinates.last()) { transitive = false }
        } else if (providers.gradleProperty("with${name}").getOrElse(withAllCompat.toString()).toBoolean()) {
            coordinates.each { coordinate ->
                if (coordinate.startsWith('maven.modrinth:sodium:')) sodiumDevelopmentArchive(coordinate) { transitive = false }
                else localRuntime(coordinate) { transitive = false }
            }
        }
    }
    localRuntime configurations.sodiumDevelopmentArchive.incoming.artifactView {
        attributes { attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'tm-wagon-sodium-development') }
    }.files
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            geckolib_version_range : geckolib_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Ship the project license and preserve the original MDK template notice.
tasks.named('jar', Jar) {
    from(rootProject.files('LICENSE', 'NOTICE', 'TEMPLATE_LICENSE.txt'))
    from(project(':core').sourceSets.main.output)
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    group = 'minecraft'
    description = "Launch Minecraft ${minecraft_version} on NeoForge with tm_wagon (${name == 'runClient' ? 'client' : 'server'})."
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
