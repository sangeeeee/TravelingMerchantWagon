plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/load-target-properties.gradle')
description = 'Minecraft 26.2 NeoForge gameplay implementation.'
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
evaluationDependsOn(':core')

configurations {
    commonJava { canBeConsumed = false; canBeResolved = true }
    commonGameplayJava { canBeConsumed = false; canBeResolved = true }
    commonResources { canBeConsumed = false; canBeResolved = true }
}
dependencies {
    compileOnly project(':core')
    commonJava project(path: ':mc-26.2:common', configuration: 'commonJava')
    commonGameplayJava project(path: ':mc-26.2:common', configuration: 'commonGameplayJava')
    commonResources project(path: ':mc-26.2:common', configuration: 'commonResources')
    implementation("maven.modrinth:geckolib:${geckolib_version_id}") { transitive = false }
}
sourceSets.main.java.srcDirs(configurations.commonJava, configurations.commonGameplayJava)
sourceSets.main.resources {
    srcDir configurations.commonResources
    exclude '**/*.bbmodel', '**/.cache/**', '**/.gitkeep'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = neo_version
    runs {
        client {
            client(); gameDirectory = file('run')
            if (providers.gradleProperty('portSmoke').getOrElse('false').toBoolean()) {
                gameDirectory = file('build/port-smoke')
                systemProperty 'tm_wagon.portSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
        }
        server {
            server(); gameDirectory = file('run-server'); programArgument '--nogui'
            if (providers.gradleProperty('serverSmoke').getOrElse('false').toBoolean()) {
                gameDirectory = file('build/server-smoke')
                systemProperty 'tm_wagon.serverSmoke', 'true'
            }
        }
    }
    mods {
        tm_wagon {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
            sourceSet project(':core').sourceSets.main
        }
    }
}

apply from: file('../compatibility.gradle')
// ModDev discovers mods from the selected runtime source set, not extra library paths.
// Client-only compatibility jars must never enter a dedicated server launch.
def clientLaunch = gradle.startParameter.taskNames.any { it.endsWith('runClient') }
if (clientLaunch) configurations.localRuntime.extendsFrom configurations.clientCompatibilityRuntime

def metadataValues = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
    mod_license: mod_license, minecraft_version_range: minecraft_version_range,
    neo_version: neo_version, loader_version_range: loader_version_range,
    geckolib_version_range: geckolib_version_range]
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties metadataValues
    expand metadataValues
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
def licenseFileName = "LICENSE_${mod_id}".toString()
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from(rootProject.file('LICENSE')) { rename { licenseFileName } }
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    group = 'minecraft'
    description = "Launch the Minecraft 26.2 NeoForge port environment (${name == 'runClient' ? 'client' : 'server'})."
}
