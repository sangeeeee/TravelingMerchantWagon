pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TravelingMerchantWagon'

// Optional workstation toolchain hints belong in the ignored local file.
// CLI -P values take precedence; each module still selects its own Java version.
def localToolchains = new Properties()
def localPropertiesFile = file('gradle-local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withReader('UTF-8') { localToolchains.load(it) }
    def selectedProperties = new LinkedHashMap(gradle.startParameter.projectProperties)
    localToolchains.each { key, value ->
        if (key.toString().startsWith('org.gradle.java.installations.')) {
            selectedProperties.putIfAbsent(key.toString(), value.toString())
        }
    }
    gradle.startParameter.projectProperties = selectedProperties
}

include 'core'

// Each version owns its loader modules. New targets are discovered on Gradle
// reload without adding aliases or a hard-coded build list at the root.
file('versions').listFiles().findAll { it.isDirectory() && it.name.startsWith('mc-') }
    .sort { it.name }.each { versionDirectory ->
        def versionPath = ":${versionDirectory.name}"
        include versionPath
        project(versionPath).projectDir = versionDirectory
        ['common', 'fabric', 'neoforge', 'forge'].each { platform ->
            def moduleDirectory = new File(versionDirectory, platform)
            if (new File(moduleDirectory, 'build.gradle').isFile()
                    || new File(moduleDirectory, 'build.gradle.kts').isFile()) {
                def modulePath = "${versionPath}:${platform}"
                include modulePath
                project(modulePath).projectDir = moduleDirectory
            }
        }
}
