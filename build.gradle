plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'fabric-loom' version '1.17.21' apply false
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

// Internal libraries and active loader targets build together. Fabric is a
// prepared dependency environment until its loader implementation is added.
def projectsToBuild = [':core', ':mc-1.21.1:common', ':mc-1.21.1:neoforge', ':mc-1.21.1:fabric']
tasks.named('build') {
    dependsOn projectsToBuild.collect { "${it}:build" }
}
tasks.named('clean') {
    dependsOn projectsToBuild.collect { "${it}:clean" }
}

// Keep convenient root entry points while development targets NeoForge 1.21.1.
['runClient', 'runServer', 'runGameTestServer', 'runClientSmokeTest'].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        description = "Run ${taskName} for the maintained NeoForge 1.21.1 target."
        dependsOn ":mc-1.21.1:neoforge:${taskName}"
    }
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}
