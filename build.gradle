plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'fabric-loom' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

// Version parents aggregate their own modules; the root aggregates all versions.
def versionProjects = subprojects.findAll { it.parent == rootProject && it.name.startsWith('mc-') }
configure(versionProjects) {
    apply plugin: 'base'
    description = "Minecraft ${name.substring(3)} build targets."
    def modulePaths = childProjects.values().collect { it.path }
    tasks.named('build') { dependsOn modulePaths.collect { "${it}:build" } }
    tasks.named('clean') { dependsOn modulePaths.collect { "${it}:clean" } }
}

def projectsToBuild = [':core'] + versionProjects.collect { it.path }
tasks.named('build') {
    dependsOn projectsToBuild.collect { "${it}:build" }
}
tasks.named('clean') {
    dependsOn projectsToBuild.collect { "${it}:clean" }
}

// Gradle otherwise selects every matching child task for a bare root runClient.
// Resolve old IDE configurations using an explicit workstation preference,
// without registering game-launch tasks on aggregate projects.
def aggregatePaths = [rootProject.path] + versionProjects.collect { it.path }
def selectedProjectDirectory = gradle.startParameter.projectDir ?: gradle.startParameter.currentDir
def selectedProjectPath = allprojects.find { it.projectDir == selectedProjectDirectory }?.path ?: rootProject.path
def localRunProperties = new Properties()
def localRunFile = file('gradle-local.properties')
if (localRunFile.isFile()) localRunFile.withReader('UTF-8') { localRunProperties.load(it) }
def defaultRunTarget = providers.gradleProperty('runTarget')
    .getOrElse(localRunProperties.getProperty('runTarget', '')).trim()
gradle.startParameter.setTaskRequests(gradle.startParameter.taskRequests.collect { request ->
    def scope = request.projectPath ?: selectedProjectPath
    def resolvedArgs = request.args.collect { argument ->
        if (!(scope in aggregatePaths) || !(argument in ['runClient', 'runServer'])) return argument
        def target = defaultRunTarget ? findProject(defaultRunTarget) : null
        if (target == null || !(target.name in ['forge', 'neoforge', 'fabric'])
            || !versionProjects.contains(target.parent)
            || (scope != ':' && target.parent.path != scope)) {
            throw new GradleException('Select a loader task, for example :mc-1.20.1:forge:' + argument
                + ', or set runTarget=:mc-1.20.1:forge in gradle-local.properties (or with -PrunTarget).')
        }
        def resolved = "${target.path}:${argument}".toString()
        logger.lifecycle("Development launch: ${argument} -> ${resolved}")
        return resolved
    }
    // Keep the scope carried by IDE Tooling API requests for all other tasks.
    resolvedArgs == request.args ? request :
        new org.gradle.internal.DefaultTaskExecutionRequest(resolvedArgs, request.projectPath, request.rootDir)
})

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}
