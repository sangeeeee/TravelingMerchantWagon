plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'fabric-loom' version '1.17.21' apply false
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

// Version parents aggregate their own modules; the root aggregates all versions.
def versionProjects = subprojects.findAll { it.parent == rootProject && it.name.startsWith('mc-') }
configure(versionProjects) {
    apply plugin: 'base'
    description = "Minecraft ${name.substring(3)} build targets."
    def modulePaths = childProjects.values().collect { it.path }
    tasks.named('build') { dependsOn modulePaths.collect { "${it}:build" } }
    tasks.named('clean') { dependsOn modulePaths.collect { "${it}:clean" } }
}

def projectsToBuild = [':core'] + versionProjects.collect { it.path }
tasks.named('build') {
    dependsOn projectsToBuild.collect { "${it}:build" }
}
tasks.named('clean') {
    dependsOn projectsToBuild.collect { "${it}:clean" }
}

// Gradle otherwise selects every matching child task for a bare root runClient.
// Require a loader path without exposing any game-launch task on aggregators.
def aggregateDirectories = [rootProject.projectDir] + versionProjects.collect { it.projectDir }
if (gradle.startParameter.currentDir in aggregateDirectories
        && gradle.startParameter.taskNames.any { !it.contains(':') && it.startsWith('run') }) {
    throw new GradleException('Select a version and loader, for example :mc-1.21.1:fabric:runClient or :mc-1.21.1:neoforge:runServer.')
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}
